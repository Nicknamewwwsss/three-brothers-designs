<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Design Projects · Three Brothers Kitchens &amp; Baths</title>
<style>
  :root{--bg:#f6f3ee;--ink:#1f1d1a;--muted:#6b665e;--line:#ddd6cb;--card:#fff;--accent:#8a6a3f}
  @media (prefers-color-scheme:dark){:root{--bg:#161513;--ink:#ece8e1;--muted:#a49d92;--line:#33302b;--card:#1f1d1a;--accent:#c9a46a}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 16px 56px}
  .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
  h1{font-size:clamp(26px,5vw,40px);margin:6px 0 24px;line-height:1.15}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none}
  a.card img{width:100%;display:block;aspect-ratio:16/10;object-fit:cover}
  .card div{padding:12px 14px}
  .card strong{display:block}
  .card span{font-size:14px;color:var(--muted)}
  footer{margin-top:40px;font-size:13px;color:var(--muted)}
  footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Three Brothers Kitchens &amp; Baths</div>
  <h1>Design Projects</h1>
  <div class="grid">
    <a class="card" href="kitchen-001/">
      <img src="kitchen-001/renders/1-overall-from-entry.jpg" alt="Kitchen 001 rendering" loading="lazy">
      <div><strong>Kitchen · Project 001</strong><span>White rift oak, Wolf / Sub-Zero suite · 3D model + 5 renderings</span></div>
    </a>
  </div>
  <footer>Three Brothers Kitchens &amp; Baths · Chappaqua, NY · (914) 297-4280 · <a href="https://threebrotherskitchensandbaths.com">threebrotherskitchensandbaths.com</a></footer>
</div>
</body>
</html>
